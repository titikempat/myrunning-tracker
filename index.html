<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunTracker AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --accent:#22c55e;
  --text:#e2e8f0;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(180deg,#020617,#020617,#020617);
  color:var(--text);
}

.container{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:16px;
  margin-top:14px;
  border:1px solid rgba(255,255,255,0.05);
}

input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:14px;
}

input,select{
  background:#020617;
  color:white;
  border:1px solid #1e293b;
}

button{
  background:var(--accent);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:.9}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  display:inline-block;
}

.too_high{background:#dc2626}
.improving{background:#16a34a}
.normal{background:#64748b}

.loader{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:#0008;
  font-size:40px;
}

.loader span{
  animation:run .5s infinite alternate;
}

@keyframes run{
  from{transform:translateX(-10px)}
  to{transform:translateX(10px)}
}

.link{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

.link span{
  color:var(--accent);
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.link span:hover{
  text-decoration:underline;
  opacity:0.8;
}

@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="loader" id="loader"><span>🏃‍♂️</span></div>

<div class="container">

<!-- LOGIN -->
<div id="loginCard" class="card">
<h2>🏃 RunTracker</h2>

<input id="user" placeholder="User / Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="link">
Belum punya akun? <span onclick="showRegister()">Daftar</span>
</div>
</div>

<!-- REGISTER -->
<div id="registerCard" class="card" style="display:none;">
<h2>Daftar</h2>

<input id="r_nama" placeholder="Nama">
<input id="r_email" placeholder="Email">
<input id="r_password" type="password" placeholder="Password">
<input id="r_usia" placeholder="Usia">
<input id="r_tinggi" placeholder="Tinggi">
<input id="r_berat" placeholder="Berat">

<select id="r_tujuan">
  <option value="">Pilih Tujuan</option>
  <option value="endurance">Endurance</option>
  <option value="turun_bb">Turun BB</option>
</select>

<button onclick="register()">Daftar</button>

<div class="link">
Sudah punya akun? <span onclick="showLogin()">Login</span>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="header">
<h3>Halo, <span id="nama"></span></h3>
<button onclick="toggleForm()">My SetorRun</button>
</div>

<div id="form" class="card" style="display:none">
<input id="tgl" type="date">
<input id="jarak" placeholder="Jarak (km)">
<input id="durasi" placeholder="Durasi (menit)">
<input id="pace" placeholder="Pace">
<input id="hr" placeholder="HR">
<button onclick="save()">Simpan</button>
</div>

<div class="card">
<h3>🤖 AI Coach</h3>
<p id="saran"></p>
</div>

<div class="card">
<h3>📊 Progress</h3>
<div class="grid">
<div>HR<br><b id="avgHR">-</b></div>
<div>Pace<br><b id="avgPace">-</b></div>
<div>Improve<br><b id="improve">-</b></div>
<div>Status<br><span id="status" class="badge">-</span></div>
</div>
</div>

<div class="card">
<h3>📈 KM / Minggu</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>📜 History</h3>
<div id="history"></div>
</div>

</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFFR0ETNNdE6UaA97a5D0caePx5Nis7Mn6emDWud2s9zHBKJQaWqs7LqA623Au6D0TgA/exec";
let uid=null;
let chart=null;

function load(v){loader.style.display=v?"flex":"none";}

// LOGIN
async function login(){
  load(true);

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"login",
      user:user.value,
      password:password.value
    })
  });

  const d=await r.json();

  if(d.status==="success"){
    uid=d.user_id;
    nama.innerText=d.nama;

    loginCard.style.display="none";
    dashboard.style.display="block";

    loadDash();
  }else alert(d.message);

  load(false);
}

// REGISTER
async function register(){

  // 🔥 VALIDASI TAMBAHAN
  if(!r_nama.value || !r_email.value || !r_password.value || !r_tujuan.value){
    alert("Semua field wajib diisi!");
    return;
  }

  load(true);

  await fetch(API+"?action=register",{
    method:"POST",
    body:JSON.stringify({
      nama:r_nama.value,
      email:r_email.value,
      password:r_password.value,
      usia:r_usia.value,
      tinggi:r_tinggi.value,
      berat:r_berat.value,
      tujuan:r_tujuan.value // ✅ FIX UTAMA
    })
  });

  load(false);
  alert("Akun berhasil dibuat & program otomatis dibuat");
  showLogin();
}

// NAV
function showRegister(){
  loginCard.style.display="none";
  registerCard.style.display="block";
}

function showLogin(){
  registerCard.style.display="none";
  loginCard.style.display="block";
}

// FORM
function toggleForm(){
  form.style.display=form.style.display=="none"?"block":"none";
}

// SAVE
async function save(){
  load(true);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"workout",
      user_id:uid,
      tanggal:tgl.value,
      jarak:jarak.value,
      durasi:durasi.value,
      pace:pace.value,
      avg_hr:hr.value
    })
  });

  form.style.display="none";
  loadDash();
  load(false);
}

// DASHBOARD
async function loadDash(){
  load(true);

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      user_id:uid
    })
  });

  const d=await r.json();

  saran.innerText=d.saran;

  if(d.progress){
    const p=d.progress;

    avgHR.innerText=p.avg_hr.toFixed(0);
    avgPace.innerText=p.avg_pace.toFixed(2);
    improve.innerText=p.improvement.toFixed(2);

    status.innerText=p.status;
    status.className="badge "+p.status;
  }

  const h=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"history",
      user_id:uid
    })
  });

  const data=await h.json();

  let html="";
  let weekly={};

  data.data.forEach(r=>{
    html+=`
    <div>
      ${r.tanggal} • ${r.jarak} km • HR ${r.hr}
    </div>`;

    const week = new Date(r.tanggal);
    const key = week.getFullYear()+"-"+week.getMonth()+"-"+Math.ceil(week.getDate()/7);

    weekly[key]=(weekly[key]||0)+Number(r.jarak);
  });

  history.innerHTML=html;

  const labels=Object.keys(weekly);
  const values=Object.values(weekly);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"KM",
        data:values,
        tension:0.4
      }]
    }
  });

  load(false);
}
</script>

</body>
</html>
