<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunTracker Pro</title>

<style>
:root{
  --bg:#020617;
  --card:rgba(255,255,255,0.05);
  --soft:#1e293b;
  --primary:#22c55e;
  --accent:#38bdf8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
}

/* CONTAINER */
.container{
  max-width:520px;
  margin:auto;
  padding:16px;
}

/* CARD PREMIUM */
.card{
  background:var(--card);
  padding:18px;
  border-radius:20px;
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.05);
  margin-top:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* INPUT */
input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  background:var(--soft);
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{opacity:.9}

.btn-primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
}

.btn-info{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
}

/* HEADER */
.header{
  font-size:22px;
  font-weight:bold;
}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  background:#020617e6;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:50px;
  z-index:999;
}

.loader span{
  animation:run .6s infinite alternate;
}

@keyframes run{
  from{transform:translateX(-20px)}
  to{transform:translateX(20px)}
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:12px 18px;
  border-radius:12px;
  display:none;
}

/* PROGRESS BAR */
.bar{
  height:10px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
}
.bar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
}

/* HISTORY ITEM */
.item{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

/* CHART */
.chart-bar{
  display:flex;
  align-items:flex-end;
  gap:6px;
  height:120px;
  margin-top:10px;
}
.chart-bar div{
  flex:1;
  background:linear-gradient(180deg,#38bdf8,#0ea5e9);
  border-radius:6px 6px 0 0;
}

#dashboard{display:none}
</style>

</head>

<body>

<div id="loader" class="loader"><span>🏃</span></div>
<div id="toast" class="toast"></div>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">
<h2>🏃 RunTracker Pro</h2>
<input id="user" placeholder="User / Email">
<input id="password" type="password" placeholder="Password">
<button class="btn-primary" onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="header">Halo, <span id="nama"></span> 👋</div>

<button class="btn-info" onclick="toggleForm()">🏃 SetorRun</button>

<div id="formRun" class="card" style="display:none;">
<input id="tanggal" type="date">
<input id="jarak" placeholder="Jarak (km)">
<input id="durasi" placeholder="Durasi (menit)">
<input id="pace" placeholder="Pace">
<input id="avg_hr" placeholder="Avg HR">
<input id="max_hr" placeholder="Max HR">
<button class="btn-primary" onclick="saveRun()">Simpan</button>
</div>

<div class="card">
<h3>🧠 AI Saran</h3>
<p id="saran">-</p>
</div>

<div class="card">
<h3>🎮 Level Progress</h3>
<div id="progress"></div>
<div class="bar"><span id="xpbar" style="width:0%"></span></div>
</div>

<div class="card">
<h3>📊 Grafik Mingguan</h3>
<div id="chart" class="chart-bar"></div>
</div>

<div class="card">
<h3>📜 Riwayat Lari</h3>
<div id="history"></div>
</div>

</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyFFR0ETNNdE6UaA97a5D0caePx5Nis7Mn6emDWud2s9zHBKJQaWqs7LqA623Au6D0TgA/exec";

let USER_ID=null;

/* UTIL */
function showLoader(v){loader.style.display=v?"flex":"none";}
function toastMsg(msg){
  toast.innerText=msg;
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",2000);
}

/* LOGIN */
async function login(){
  showLoader(true);

  try{
    const res=await fetch(API+"?action=login",{
      method:"POST",
      body:JSON.stringify({
        user:user.value,
        password:password.value
      })
    });

    const data=await res.json();

    if(data.status==="success"){
      USER_ID=data.user_id;
      nama.innerText=data.nama;

      loginCard.style.display="none";
      dashboard.style.display="block";

      loadDashboard();
    }else{
      toastMsg(data.message);
    }

  }catch(e){
    toastMsg("Server error");
  }

  showLoader(false);
}

/* FORM */
function toggleForm(){
  formRun.style.display =
    formRun.style.display==="none"?"block":"none";
}

/* SAVE RUN */
async function saveRun(){
  showLoader(true);

  await fetch(API+"?action=workout",{
    method:"POST",
    body:JSON.stringify({
      user_id:USER_ID,
      tanggal:tanggal.value,
      jarak:jarak.value,
      durasi:durasi.value,
      pace:pace.value,
      avg_hr:avg_hr.value,
      max_hr:max_hr.value
    })
  });

  showLoader(false);
  formRun.style.display="none";
  document.querySelectorAll("#formRun input").forEach(i=>i.value="");

  toastMsg("Run tersimpan 🚀");
  loadDashboard();
}

/* LOAD DASHBOARD */
async function loadDashboard(){
  showLoader(true);

  const dash=await fetch(API+"?action=getDashboard",{
    method:"POST",
    body:JSON.stringify({user_id:USER_ID})
  });

  const d=await dash.json();

  saran.innerText=d.saran;

  progress.innerHTML=`
    Avg HR: <b>${Math.round(d.avgHR)}</b><br>
    Avg Pace: <b>${d.avgPace}</b><br>
    Status: <b>${d.statusLatihan}</b>
  `;

  /* LEVEL SYSTEM */
  let level=Math.floor(d.avgPace)+1;
  let xp=(150-d.avgHR);
  xpbar.style.width=Math.max(5,xp)+"%";

  /* HISTORY */
  const res=await fetch(API+"?action=getHistory",{
    method:"POST",
    body:JSON.stringify({user_id:USER_ID})
  });

  const data=await res.json();

  if(data.status==="success"){
    renderHistory(data.data);
    renderChart(data.data);
  }

  showLoader(false);
}

/* HISTORY */
function renderHistory(runs){
  let html="";
  runs.reverse().slice(0,7).forEach(r=>{
    html+=`
    <div class="item">
      ${r.tanggal}<br>
      ${r.jarak} km • HR ${r.avg_hr}
    </div>`;
  });
  history.innerHTML=html;
}

/* CHART */
function renderChart(runs){
  let week={};

  runs.forEach(r=>{
    let d=new Date(r.tanggal);
    let w=getWeek(d);
    week[w]=(week[w]||0)+Number(r.jarak);
  });

  chart.innerHTML="";

  Object.values(week).slice(-6).forEach(km=>{
    let h=Math.min(100,km*10);
    chart.innerHTML+=`<div style="height:${h}%"></div>`;
  });
}

function getWeek(d){
  const first=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-first)/86400000)+first.getDay()+1)/7);
}
</script>

</body>
</html>
